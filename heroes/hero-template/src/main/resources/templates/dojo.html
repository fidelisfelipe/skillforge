<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥋 SkillForge Dojo - Kata MVP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .section {
            margin: 30px 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .theme-card {
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-card:hover {
            border-color: #667eea;
            background: #f5f5ff;
            transform: translateY(-2px);
        }

        .theme-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .theme-desc {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .theme-difficulty {
            display: inline-block;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #333;
        }

        .status-box {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            max-height: 300px;
            overflow-y: auto;
        }

        .status-box.success {
            border-left-color: #4caf50;
            background: #f1f8f5;
        }

        .status-box.error {
            border-left-color: #f44336;
            background: #fdf1f0;
            color: #d32f2f;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hero-info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .hero-id {
            font-weight: 600;
            color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        #statusLog {
            max-height: 250px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .log-entry.info { color: #667eea; }
        .log-entry.success { color: #4caf50; }
        .log-entry.error { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🥋 SkillForge Dojo MVP</h1>
            <p class="subtitle">Phase 5.0 - Kata Training System</p>
        </header>

        <div class="hero-info">
            <span>Hero: <span class="hero-id" id="heroId">Loading...</span></span>
        </div>

        <!-- Phase 1: Listar Temas -->
        <div class="section">
            <div class="section-title">📋 Step 1: Available Themes</div>
            <button onclick="requestThemes()">
                <span id="btnListThemes">📋 List Themes</span>
            </button>
            <div id="themesContainer"></div>
        </div>

        <!-- Phase 2: Escolher Tema -->
        <div class="section">
            <div class="section-title">🎯 Step 2: Current Kata</div>
            <div id="currentKataContainer" style="display:none;">
                <div id="kataInfo"></div>
                <button onclick="acceptKata()">✅ Accept Kata</button>
                <button onclick="requestDifferent()">🔄 Request Different</button>
            </div>
            <div id="noKataMessage" style="color: #999; font-size: 14px;">
                No kata selected. Choose a theme first.
            </div>
        </div>

        <!-- Status -->
        <div class="section">
            <div class="section-title">📊 Status Log</div>
            <div class="status-box" id="statusContainer">
                <div id="statusLog"></div>
            </div>
        </div>
    </div>

    <script>
        const HERO_ID = /*[[${heroId}]]*/ 'hero-template';
        let eventSource = null;
        let currentKata = null;
        let currentThemeId = null;
        let currentThemes = [];

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('heroId').textContent = HERO_ID;
            setupSSE();
            log('info', '🚀 Dojo initialized. Ready to request themes.');
        });

        // ===== SSE Setup =====
        function setupSSE() {
            const sseUrl = `/dojo/sse?heroId=${HERO_ID}`;
            eventSource = new EventSource(sseUrl);

            eventSource.addEventListener('THEMES_LOADED', function(event) {
                const data = JSON.parse(event.data);
                log('success', `📋 Received ${data.themesCount} themes`);
                displayThemes(data.themes);
            });

            eventSource.addEventListener('KATA_DELIVERED', function(event) {
                const data = JSON.parse(event.data);
                log('success', `🎯 Kata delivered: ${data.kataId}`);
                currentKata = data;
                displayKata(data);
            });

            eventSource.addEventListener('KATA_VALIDATED', function(event) {
                const data = JSON.parse(event.data);
                log('success', `✅ KATA VALIDATED! Score: ${data.score}/100 | XP: ${data.xpEarned} | Skill: ${data.skill}`);
            });

            eventSource.addEventListener('KATA_VALIDATION_FAILED', function(event) {
                const data = JSON.parse(event.data);
                log('error', `❌ Kata validation failed. Score: ${data.score}/100`);
            });

            eventSource.addEventListener('ERROR', function(event) {
                const data = JSON.parse(event.data);
                log('error', `⚠️ Error: ${data.message}`);
            });

            eventSource.onerror = function() {
                log('error', '❌ SSE connection failed');
            };
        }

        // ===== Request Themes =====
        function requestThemes() {
            log('info', '📨 Requesting themes...');
            fetch('/dojo/api/request-themes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ heroId: HERO_ID })
            })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                log('info', '✅ Request sent to hub');
            })
            .catch(e => log('error', `Error: ${e.message}`));
        }

        // ===== Display Themes =====
        function displayThemes(themes) {
            currentThemes = themes;
            const html = themes.map(t => `
                <div class="theme-card" onclick="chooseTheme('${t.id}')">
                    <div class="theme-name">${t.name}</div>
                    <div class="theme-desc">${t.description}</div>
                    <span class="theme-difficulty">${t.difficulty}</span>
                </div>
            `).join('');
            document.getElementById('themesContainer').innerHTML = html;
        }

        // ===== Choose Theme =====
        function chooseTheme(themeId) {
            currentThemeId = themeId;
            log('info', `🎯 Choosing theme: ${themeId}...`);
            fetch('/dojo/api/choose-theme', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ heroId: HERO_ID, themeId: themeId })
            })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                log('info', '✅ Theme selection sent');
            })
            .catch(e => log('error', `Error: ${e.message}`));
        }

        // ===== Display Kata =====
        function displayKata(kata) {
            const html = `
                <div style="border: 2px solid #667eea; padding: 20px; border-radius: 8px;">
                    <h3 style="color: #667eea; margin-bottom: 10px;">📚 ${kata.title}</h3>
                    <p style="color: #666; font-size: 13px; line-height: 1.6; margin-bottom: 15px;">
                        ${kata.spec.replace(/\n/g, '<br>')}
                    </p>
                    <div style="background: #f5f5f5; padding: 10px; border-radius: 4px; font-size: 12px; color: #666;">
                        <strong>Difficulty:</strong> ${kata.difficulty} |
                        <strong>XP Reward:</strong> ${kata.xpReward}
                    </div>
                </div>
            `;
            document.getElementById('kataInfo').innerHTML = html;
            document.getElementById('currentKataContainer').style.display = 'block';
            document.getElementById('noKataMessage').style.display = 'none';
        }

        // ===== Accept Kata =====
        function acceptKata() {
            if (!currentKata) {
                log('error', 'No kata to accept');
                return;
            }
            const kataSlug = currentKata.kataId.replace('KATA-', 'kata-').toLowerCase();
            const solutionBranch = `${kataSlug}-${HERO_ID}-solution`;
            const repoUrl = currentKata.solutionTemplatePath
                .replace('/tree/' + kataSlug + '-template', '.git')
                .replace(/\/tree\/.*$/, '.git');
            const templateBranch = kataSlug + '-template';

            log('info', `✅ Kata aceito: ${currentKata.kataId}`);
            log('info', '─────────────────────────────────────────');
            log('info', '📖 Passos para resolver:');
            log('info', `  1. git clone -b ${templateBranch} ${repoUrl} ${kataSlug}`);
            log('info', `  2. cd ${kataSlug}`);
            log('info', `  3. git checkout -b ${solutionBranch}`);
            log('info', '  4. Implemente: src/main/java/com/skillforge/kata/');
            log('info', '  5. mvn verify   ← deve ficar verde');
            log('info', `  6. git push origin ${solutionBranch}`);
            log('info', '  7. Abra PR com o body:');
            log('info', `       heroId: ${HERO_ID}`);
            log('info', '─────────────────────────────────────────');
        }

        // ===== Request Different =====
        function requestDifferent() {
            if (!currentKata) return;
            const themeId = currentKata.themeId || currentThemeId;
            if (!themeId) {
                log('error', 'Cannot request different kata: themeId unknown');
                return;
            }
            log('info', '🔄 Requesting different kata...');
            fetch('/dojo/api/request-different', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ heroId: HERO_ID, themeId: themeId })
            })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                log('info', '✅ Request sent');
            })
            .catch(e => log('error', `Error: ${e.message}`));
        }

        // ===== Logging =====
        function log(type, message) {
            const logDiv = document.getElementById('statusLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
