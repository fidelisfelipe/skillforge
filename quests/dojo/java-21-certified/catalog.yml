  # ─────────────────────────────────────────────────────────────
  - id: ch07-beyond-classes
    name: "Ch.07 — Beyond Classes"
    description: "Records, sealed classes, pattern matching and interfaces"
    difficulty: intermediate
    certReference: "OCP Java 21 (1Z0-830) — Chapter 7"
    katas:
      - id: KATA-002A
        title: "Records: Modelo de Domínio Imutável"
        difficulty: beginner
        xpReward: 80
        templateBranch: kata-002a-template
        className: MoneyRecord
        spec: |
          Converta Money, Address e Order em Java Records (§7.4).
          Garanta que equals/hashCode funcionem corretamente em coleções.
      - id: KATA-002B
        title: "Records: Compact Constructors e Validação"
        difficulty: beginner
        xpReward: 90
        templateBranch: kata-002b-template
        className: Temperature
        spec: |
          Crie um Record Temperature que aceita apenas valores entre -273.15°C e
          1.416e32°C e lança IllegalArgumentException fora do range.
          Use compact constructor (§7.4).
      - id: KATA-004A
        title: "Sealed Classes: Payment Type Hierarchy"
        difficulty: intermediate
        xpReward: 90
        templateBranch: kata-004a-template
        className: PaymentProcessor
        spec: |
          Modele um sistema de pagamentos com sealed interface Payment (§7.3) e
          implementações CreditCard, Pix, BankSlip. Implemente processamento
          específico por tipo sem instanceof explícito.
      - id: KATA-004B
        title: "Sealed Types: Exhaustive Switch"
        difficulty: advanced
        xpReward: 110
        templateBranch: kata-004b-template
        className: ResultHandler
        spec: |
          Crie sealed interface Result<T> com Success<T> e Failure<T> (§7.3).
          O compilador deve garantir que todo switch seja exaustivo.
      - id: KATA-003A
        title: "Pattern Matching: instanceof sem Casting"
        difficulty: intermediate
        xpReward: 90
        templateBranch: kata-003a-template
        className: ShapeClassifier
        spec: |
          Refatore um método com 10+ blocos if (x instanceof Foo) { Foo f = (Foo) x; }
          usando pattern matching para instanceof (§7.6 + Chapter 3).
      - id: KATA-003B
        title: "Switch Expressions com Guarded Patterns"
        difficulty: intermediate
        xpReward: 100
        templateBranch: kata-003b-template
        className: ShapeAnalyzer
        spec: |
          Implemente um classificador de Shape (Circle, Rectangle, Triangle) que retorna
          área, perímetro e categoria usando switch com when guards (§3.2 + §7.3).
      - id: KATA-003C
        title: "Record Deconstruction Patterns"
        difficulty: advanced
        xpReward: 130
        templateBranch: kata-003c-template
        className: EventHandler
        spec: |
          Dado sealed interface Event com Records UserCreated(String id, String email),
          OrderPlaced(String orderId, double amount), implemente um handler usando
          deconstruction patterns (§7.4 + §7.3).
      - id: KATA-002C
        title: "Sealed Interfaces + Records: ADT em Java"
        difficulty: intermediate
        xpReward: 110
        templateBranch: kata-002c-template
        className: ExprEvaluator
        spec: |
          Defina sealed interface Expr com implementações Num, Add, Mul como Records (§7.3 + §7.4).
          Implemente um evaluator recursivo sem instanceof tradicional.

