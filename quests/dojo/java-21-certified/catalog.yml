themes:

  # ─────────────────────────────────────────────────────────────
  # Chapter 1 — Building Blocks
  # 1.1 Environment · 1.2 Class Structure · 1.3 main() Method
  # 1.4 Packages & Imports · 1.5 Creating Objects
  # 1.6 Data Types · 1.7-1.9 Variables · 1.10 Destroying Objects
  # ─────────────────────────────────────────────────────────────
  - id: ch01-building-blocks
    name: "Ch.01 — Building Blocks"
    description: "Class structure, data types, variable scope and object lifecycle"
    difficulty: beginner
    certReference: "OCP Java 21 (1Z0-830) — Chapter 1"
    katas:
      - id: KATA-015A
        title: "Tipos primitivos: limites e literais"
        difficulty: beginner
        xpReward: 70
        templateBranch: kata-015a-template
        className: PrimitiveLimits
        spec: |
          Implemente uma classe utilitária com métodos que retornam valores literais e limites dos tipos primitivos do Java.
          
          Métodos a implementar:
          
          1. `int maxByte()` — retorna o valor máximo de um `byte` (use `Byte.MAX_VALUE`).
          2. `long binaryLiteral()` — retorna o número 10 expresso como literal binário (`0b1010`).
          3. `long underscoreMillion()` — retorna 1_000_000 usando separadores de underline no literal.
          4. `int hexFifteen()` — retorna 15 escrito como literal hexadecimal (`0xF`).
          5. `double scientificNotation()` — retorna 1.5e3 (igual a 1500.0).
          
          Objetivo: praticar literais numéricos, underscores, prefixos `0b`/`0x` e notação científica.
      - id: KATA-015B
        title: "Inferência de tipo com var"
        difficulty: beginner
        xpReward: 70
        templateBranch: kata-015b-template
        className: VarInference
        spec: |
          Implemente métodos usando a palavra-chave `var` para variáveis locais. Lembre-se que `var` só funciona em variáveis locais (não em campos, parâmetros ou retornos) e exige inicialização.
          
          Métodos a implementar:
          
          1. `String greet(String name)` — declare `var greeting = "Olá, "` e concatene com `name`, retornando o resultado.
          2. `int sumList()` — declare `var numbers = java.util.List.of(1, 2, 3, 4, 5)` e retorne a soma (15).
          3. `int countWords(String sentence)` — declare `var parts = sentence.split(" ")` e retorne `parts.length`.
          4. `double averageOfTen()` — use `var total = 0.0` em um laço de 1 a 10, retornando a média (5.5).
          
          Objetivo: usar `var` corretamente em escopo local e perceber que o tipo é inferido em tempo de compilação.
      - id: KATA-015C
        title: "Escopo de variáveis: bloco, método e classe"
        difficulty: beginner
        xpReward: 75
        templateBranch: kata-015c-template
        className: ScopeRules
        spec: |
          Implemente métodos que demonstram as regras de escopo em Java: variáveis de bloco, variáveis locais (método) e variáveis de instância (classe).
          
          Elementos a implementar:
          
          1. Campo de instância `int counter` inicializado em 0.
          2. `int increment()` — incrementa `counter` em 1 e retorna o novo valor.
          3. `int currentCounter()` — retorna o valor atual de `counter` sem modificá-lo.
          4. `int sumBlockScope(int n)` — use um laço `for (int i = 1; i <= n; i++)` somando `i` em uma variável local `total`. Retorne `total`. A variável `i` deve existir apenas dentro do bloco do `for`.
          5. `int shadowExample(int counter)` — receba um parâmetro chamado `counter` (sombreando o campo) e retorne `counter * 2`, sem alterar o campo da instância.
          
          Objetivo: distinguir escopo de bloco, método e classe, além de entender variable shadowing.
      - id: KATA-015D
        title: "Inicialização: campos, construtores e blocos"
        difficulty: beginner
        xpReward: 80
        templateBranch: kata-015d-template
        className: ObjectLifecycle
        spec: |
          Implemente uma classe que demonstra a ordem de inicialização de um objeto Java.
          
          Requisitos:
          
          1. Campo `java.util.List<String> log` inicializado como `new java.util.ArrayList<>()` na declaração.
          2. Campo `int value` inicializado com 1 na declaração.
          3. Bloco de inicialização de instância (`{ ... }`) que adiciona a string `"instance-init"` ao `log` e atualiza `value` para 2.
          4. Construtor sem argumentos que adiciona `"constructor"` ao `log` e atualiza `value` para 3.
          5. Método `java.util.List<String> getLog()` que retorna a lista `log`.
          6. Método `int getValue()` que retorna `value`.
          
          Após `new ObjectLifecycle()`, o log deve conter exatamente ["instance-init", "constructor"] e `value` deve ser 3.
          
          Objetivo: entender a ordem: inicialização de campos → bloco de instância → construtor.
      - id: KATA-015E
        title: "Ciclo de vida e elegibilidade ao GC"
        difficulty: beginner
        xpReward: 75
        templateBranch: kata-015e-template
        className: GarbageCollectionDemo
        spec: |
          Implemente métodos que demonstram conceitos de elegibilidade para garbage collection e referências em Java.
          
          Métodos a implementar:
          
          1. `String createAndDiscard()` — crie uma `StringBuilder` local com `"temp"`, atribua-a a uma variável, depois reatribua a variável para `null` e retorne a string `"discarded"`. (Demonstra perda de referência.)
          2. `int sizeBeforeNull()` — crie uma `java.util.List<Integer>` com 3 elementos, guarde seu tamanho em uma variável, atribua a referência da lista para `null` e retorne o tamanho guardado (3).
          3. `String reassignReference()` — declare `var s = new String("primeiro")`, depois reatribua `s = new String("segundo")` e retorne `s`. O resultado deve ser `"segundo"`. (O primeiro objeto torna-se elegível ao GC.)
          4. `boolean isSameReference()` — crie duas variáveis apontando para o **mesmo** objeto `Object obj = new Object(); Object alias = obj;` e retorne `obj == alias` (deve ser `true`).
          
          Objetivo: compreender quando objetos tornam-se elegíveis ao garbage collector e a diferença entre referência e objeto.

  # ─────────────────────────────────────────────────────────────
  # Chapter 2 — Operators
  # 2.1 Java Operators · 2.2 Unary · 2.3 Binary Arithmetic
  # 2.4 Assigning Values · 2.5 Comparing Values · 2.6 Ternary
  # ─────────────────────────────────────────────────────────────
  - id: ch02-operators
    name: "Ch.02 — Operators"
    description: "Unary, binary, comparison and ternary operators"
    difficulty: beginner
    certReference: "OCP Java 21 (1Z0-830) — Chapter 2"
    katas:
      - id: KATA-016A
        title: "Operadores aritméticos e precedência"
        difficulty: beginner
        xpReward: 65
        templateBranch: kata-016a-template
        className: ArithmeticOps
        spec: |
          Implemente uma classe utilitária com métodos que demonstrem operadores aritméticos e regras de precedência em Java.
          
          Métodos a implementar:
          
          1. `int sum(int a, int b)` — retorna a soma de `a` e `b`.
          2. `int remainder(int a, int b)` — retorna o resto da divisão de `a` por `b` (operador `%`).
          3. `int integerDivision(int a, int b)` — retorna a divisão inteira de `a` por `b` (operador `/` entre inteiros).
          4. `double mixedDivision(int a, int b)` — retorna a divisão de `a` por `b` como `double` (promoção numérica).
          5. `int precedenceExample()` — retorna o resultado de `2 + 3 * 4 - 10 / 2` (espera-se 9), respeitando precedência sem usar parênteses extras.
          
          Objetivo: praticar `+`, `-`, `*`, `/`, `%`, promoção numérica e precedência de operadores.
      - id: KATA-016B
        title: "Operadores unários: incremento e decremento"
        difficulty: beginner
        xpReward: 70
        templateBranch: kata-016b-template
        className: UnaryOps
        spec: |
          Implemente métodos que demonstrem operadores unários do Java: `++`, `--`, `-` (negação) e `!` (negação lógica).
          
          Métodos a implementar:
          
          1. `int postIncrementResult(int x)` — recebe `x`, executa `x++` e retorna o valor de `x` APÓS o incremento (espera-se `x + 1`).
          2. `int preIncrementResult(int x)` — recebe `x`, executa `++x` e retorna o valor resultante (espera-se `x + 1`).
          3. `int postIncrementInExpression()` — declare `int a = 5;` e retorne o resultado de `a++ + a` (deve retornar `5 + 6 = 11`).
          4. `int negate(int x)` — retorna `-x` usando o operador unário de negação.
          5. `boolean not(boolean b)` — retorna `!b`.
          
          Objetivo: entender a diferença entre pré e pós incremento e o uso dos operadores unários.
      - id: KATA-016C
        title: "Operadores de comparação"
        difficulty: beginner
        xpReward: 65
        templateBranch: kata-016c-template
        className: ComparisonOps
        spec: |
          Implemente métodos que utilizem operadores de comparação relacionais (`<`, `>`, `<=`, `>=`, `==`, `!=`).
          
          Métodos a implementar:
          
          1. `boolean isGreater(int a, int b)` — retorna `true` se `a > b`.
          2. `boolean isLessOrEqual(int a, int b)` — retorna `true` se `a <= b`.
          3. `boolean areEqual(int a, int b)` — retorna `true` se `a == b`.
          4. `boolean areDifferent(int a, int b)` — retorna `true` se `a != b`.
          5. `boolean inRange(int value, int min, int max)` — retorna `true` se `value` está entre `min` e `max` inclusivos (use `>=` e `<=` combinados com `&&`).
          
          Objetivo: praticar operadores relacionais que retornam `boolean`.
      - id: KATA-016D
        title: "Operadores lógicos e curto-circuito"
        difficulty: beginner
        xpReward: 75
        templateBranch: kata-016d-template
        className: LogicalOps
        spec: |
          Implemente métodos que demonstrem operadores lógicos do Java: `&&`, `||`, `!`, `&` e `|`.
          
          Métodos a implementar:
          
          1. `boolean and(boolean a, boolean b)` — retorna `a && b` (E lógico com curto-circuito).
          2. `boolean or(boolean a, boolean b)` — retorna `a || b` (OU lógico com curto-circuito).
          3. `boolean xor(boolean a, boolean b)` — retorna `a ^ b` (OU exclusivo).
          4. `boolean shortCircuitSafe(Integer value)` — retorna `value != null && value > 0`. O método deve aproveitar o curto-circuito para evitar `NullPointerException` quando `value` é `null`.
          5. `boolean isLeapYear(int year)` — retorna `true` se `year` é bissexto: divisível por 4 e (não divisível por 100 ou divisível por 400).
          
          Objetivo: praticar operadores lógicos e a importância do curto-circuito.
      - id: KATA-016E
        title: "Operador ternário"
        difficulty: beginner
        xpReward: 70
        templateBranch: kata-016e-template
        className: TernaryOps
        spec: |
          Implemente métodos usando exclusivamente o operador ternário (`condição ? valorSeVerdadeiro : valorSeFalso`). Não use `if/else` nestes métodos.
          
          Métodos a implementar:
          
          1. `int max(int a, int b)` — retorna o maior entre `a` e `b` usando ternário.
          2. `String parity(int n)` — retorna `"par"` se `n` é par, `"ímpar"` caso contrário.
          3. `int absoluteValue(int n)` — retorna o valor absoluto de `n` usando ternário.
          4. `String sign(int n)` — retorna `"positivo"`, `"negativo"` ou `"zero"` conforme o sinal de `n`. Pode usar ternário aninhado.
          5. `int clamp(int value, int min, int max)` — retorna `min` se `value < min`, `max` se `value > max`, caso contrário `value`. Use ternário aninhado.
          
          Objetivo: praticar o operador ternário, inclusive aninhado.

  # ─────────────────────────────────────────────────────────────
  # Chapter 3 — Making Decisions
  # 3.1 Decision Statements · 3.2 Switch Statements & Expressions
  # 3.3 While Loops · 3.4 For Loops · 3.5 Branching
