  - id: ch03-making-decisions
    name: "Ch.03 — Making Decisions"
    description: "Switch expressions, loops and control flow"
    difficulty: intermediate
    certReference: "OCP Java 21 (1Z0-830) — Chapter 3 (§3.2)"
    katas:
      - id: KATA-006A
        title: "Switch Expressions: Substituir if-else chains"
        difficulty: intermediate
        xpReward: 80
        templateBranch: kata-006a-template
        className: DayClassifier
        spec: |
          Refatore métodos com if-else em cadeia para switch expressions com
          arrow syntax. Cubra enums, Strings e tipos primitivos.
      - id: KATA-006B
        title: "Switch com yield e blocos"
        difficulty: intermediate
        xpReward: 90
        templateBranch: kata-006b-template
        className: PricingEngine
        spec: |
          Implemente um motor de precificação com lógica multi-linha em switch
          usando yield. Cada case executa validações antes de retornar o preço.

  # ─────────────────────────────────────────────────────────────
  # Chapter 4 — Core APIs
  # 4.1 Strings · 4.2 StringBuilder · 4.3 Equality
  # 4.4 Arrays · 4.5 Math APIs · 4.6 Dates and Times
  # ─────────────────────────────────────────────────────────────
  - id: ch04-core-apis
    name: "Ch.04 — Core APIs"
    description: "String API, Text Blocks, StringBuilder, dates and times"
    difficulty: beginner
    certReference: "OCP Java 21 (1Z0-830) — Chapter 4"
    katas:
      - id: KATA-005A
        title: "Text Blocks: Templates sem Escape Hell"
        difficulty: beginner
        xpReward: 60
        templateBranch: kata-005a-template
        className: TemplateRenderer
        spec: |
          Converta geradores de JSON, HTML e SQL que usam concatenação e \n
          para Text Blocks. Os testes verificam indentação e formatação corretas.
      - id: KATA-014A
        title: "String API: Métodos Modernos de Texto"
        difficulty: beginner
        xpReward: 70
        templateBranch: kata-014a-template
        className: TextProcessor
        spec: |
          Implemente a classe TextProcessor utilizando métodos modernos da String API (Java 11+):
          isBlank(), repeat(), lines() e strip(). Demonstre domínio da §4.1 do guia OCP.
      - id: KATA-014B
        title: "String API: Text Blocks e Formatação"
        difficulty: beginner
        xpReward: 80
        templateBranch: kata-014b-template
        className: TextFormatter
        spec: |
          Implemente TextFormatter usando Text Blocks (""") e String.formatted().
          Cubra indentação com indent(), contagem de linhas e saudações formatadas.

  # ─────────────────────────────────────────────────────────────
  # Chapter 5 — Methods
  # 5.1 Designing Methods · 5.2 Local/Instance Variables
  # 5.3 Varargs · 5.4 Access Modifiers · 5.5 Static Data
  # 5.6 Passing Data · 5.7 Overloading
  # ─────────────────────────────────────────────────────────────
  - id: ch05-methods
    name: "Ch.05 — Methods"
    description: "Method design, varargs, access modifiers, static members and overloading"
    difficulty: beginner
    certReference: "OCP Java 21 (1Z0-830) — Chapter 5"
    katas:
      - id: KATA-017A
        title: "Sobrecarga de métodos: resolução pelo tipo do parâmetro"
        difficulty: intermediate
        xpReward: 90
        templateBranch: kata-017a-template
        className: OverloadResolver
        spec: |
          Implemente uma classe `OverloadResolver` com vários métodos `describe` sobrecarregados que retornam uma `String` indicando qual sobrecarga foi escolhida pelo compilador.
          
          Métodos a implementar:
          
          1. `String describe(int x)` — retorna `"int"`.
          2. `String describe(long x)` — retorna `"long"`.
          3. `String describe(double x)` — retorna `"double"`.
          4. `String describe(Integer x)` — retorna `"Integer"`.
          5. `String describe(Object x)` — retorna `"Object"`.
          6. `String describe(String x)` — retorna `"String"`.
          
          Objetivo: compreender a ordem de resolução de sobrecarga do Java — correspondência exata > widening primitivo > autoboxing > varargs, e que tipos específicos têm precedência sobre `Object`.
          
          Observação: NÃO crie um método `describe(short)`; o teste passará um `short` e verificará que ele sofre widening para `int`.
      - id: KATA-017B
        title: "Varargs: somatórios e estatísticas"
        difficulty: intermediate
        xpReward: 95
        templateBranch: kata-017b-template
        className: VarargsCalculator
        spec: |
          Implemente uma classe `VarargsCalculator` que utiliza parâmetros varargs (`...`) para operar sobre uma quantidade variável de argumentos.
          
          Métodos a implementar:
          
          1. `int sum(int... numbers)` — retorna a soma de todos os números; retorna `0` se nenhum argumento for passado.
          2. `double average(double... values)` — retorna a média aritmética; retorna `0.0` se o array estiver vazio.
          3. `int max(int first, int... rest)` — retorna o maior valor considerando `first` e todos os elementos de `rest`. O parâmetro `first` é obrigatório.
          4. `String join(String separator, String... parts)` — concatena `parts` separados por `separator`. Se `parts` estiver vazio, retorna `""`.
          5. `int count(Object... items)` — retorna a quantidade de itens recebidos (tamanho do array de varargs).
          
          Objetivo: praticar varargs, lembrar que internamente são arrays e que apenas o último parâmetro pode ser varargs.
      - id: KATA-017C
        title: "Passagem por valor: primitivos e referências"
        difficulty: intermediate
        xpReward: 100
        templateBranch: kata-017c-template
        className: PassByValueDemo
        spec: |
          Java sempre passa argumentos por valor. Para primitivos, isso significa cópia do valor; para objetos, cópia da referência (ambas apontam para o mesmo objeto).
          
          Implemente uma classe `PassByValueDemo` com os métodos:
          
          1. `void increment(int x)` — tenta incrementar `x` em 1. Como `int` é primitivo, a alteração NÃO se propaga para o chamador. O corpo deve apenas executar `x++;`.
          
          2. `void reassignArray(int[] arr)` — reatribui o parâmetro local: `arr = new int[]{99, 99, 99};`. A reatribuição NÃO afeta o array original do chamador.
          
          3. `void mutateArray(int[] arr)` — se `arr` não for nulo e tiver pelo menos 1 elemento, define `arr[0] = 42`. A mutação SE PROPAGA pois ambos referenciam o mesmo objeto.
          
          4. `void appendExclamation(StringBuilder sb)` — chama `sb.append("!")`. A mutação do objeto SE PROPAGA.
          
          5. `void reassignStringBuilder(StringBuilder sb)` — executa `sb = new StringBuilder("novo");`. A reatribuição NÃO afeta o chamador.
          
          Objetivo: entender a distinção entre mutação de objeto (visível) e reatribuição de referência (invisível) ao chamador.
      - id: KATA-017D
        title: "Métodos estáticos vs de instância"
        difficulty: intermediate
        xpReward: 95
        templateBranch: kata-017d-template
        className: Counter
        spec: |
          Implemente uma classe `Counter` que demonstra a diferença entre membros estáticos (compartilhados pela classe) e de instância (próprios de cada objeto).
          
          Requisitos:
          
          1. Campo de instância `private int count` que começa em 0.
          2. Campo estático `private static int totalInstances` que conta quantas instâncias da classe foram criadas. Deve ser incrementado no construtor.
          3. Construtor sem argumentos que incrementa `totalInstances`.
          4. `void increment()` — método de instância que incrementa `count` em 1.
          5. `int getCount()` — método de instância que retorna o valor de `count`.
          6. `static int getTotalInstances()` — método estático que retorna `totalInstances`.
          7. `static void resetTotalInstances()` — método estático que zera `totalInstances` (útil para testes).
          8. `static int sumOfCounts(Counter... counters)` — método estático que recebe varargs de `Counter` e retorna a soma dos `count` de cada um.
          
          Objetivo: praticar a distinção entre estado por instância e estado por classe, e a impossibilidade de acessar `this` em métodos estáticos.
      - id: KATA-017E
        title: "Sobrecarga com autoboxing e varargs"
        difficulty: intermediate
        xpReward: 110
        templateBranch: kata-017e-template
        className: BoxingOverload
        spec: |
          Quando há sobrecarga envolvendo primitivos, wrappers e varargs, o compilador segue uma ordem estrita de preferência: (1) correspondência exata, (2) widening primitivo, (3) autoboxing/unboxing, (4) varargs (sempre por último).
          
          Implemente uma classe `BoxingOverload` com:
          
          1. `String pick(int x)` — retorna `"int"`.
          2. `String pick(Integer x)` — retorna `"Integer"`.
          3. `String pick(long x)` — retorna `"long"`.
          4. `String pick(int... xs)` — retorna `"varargs"`.
          5. `String pick(Object x)` — retorna `"Object"`.
          
          E também os métodos:
          
          6. `String invokeWithInt()` — chame internamente `pick(7)` (literal `int`) e retorne o resultado. Deve resolver para `"int"`.
          
          7. `String invokeWithInteger()` — declare `Integer i = 7;` e chame `pick(i)`. Deve resolver para `"Integer"`.
          
          8. `String invokeWithShort()` — declare `short s = 7;` e chame `pick(s)`. Como não há sobrecarga para `short`, ocorre widening para `int`, resultando em `"int"`.
          
          9. `String invokeWithTwoInts()` — chame `pick(1, 2)`. Como há dois argumentos, apenas a sobrecarga varargs corresponde: `"varargs"`.
          
          Objetivo: dominar a ordem de resolução de sobrecarga em situações ambíguas com boxing e varargs.

