server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: classpath:skillforge-local.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:skillforge-dev}
    key-store-type: PKCS12
    key-alias: skillforge

spring:
  application:
    name: guild-hub
  rabbitmq:
    addresses: ${AMQP_URL}
    ssl:
      enabled: ${AMQP_SSL_ENABLED:false}

guild:
  github:
    owner: fidelisfelipe
    repo: skillforge
    token: ${GITHUB_TOKEN:}
    oauth:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  hub:
    public-url: ${HUB_PUBLIC_URL:http://localhost:8080}
  onboarding:
    secret: ${ONBOARDING_SECRET:}
  ngrok:
    domain: ${NGROK_DOMAIN:}
    auth-token: ${NGROK_AUTHTOKEN:}
  amqp:
    exchange: ${AMQP_EXCHANGE:skillforge}
    queue: ${AMQP_QUEUE:skillforge.problems}
  reviewer:
    max-revisions: ${MAX_REVISIONS:3}
  dashboard:
    show-generic-heroes: ${SHOW_GENERIC_HEROES:true}
  mtls:
    enabled: ${MTLS_ENABLED:false}
    certs-dir: ${MTLS_CERTS_DIR:./certs}

cloudamqp:
  api-key: ${CLOUDAMQP_API_KEY:}

skillforge:
  skill-validation:
    confidence-threshold: ${SKILL_CONFIDENCE_THRESHOLD:0.75}
  heartbeat:
    timeout-ms: ${HEARTBEAT_TIMEOUT_MS:180000}        # 3 min sem heartbeat = offline
    check-interval-ms: ${HEARTBEAT_CHECK_INTERVAL_MS:60000}  # verifica a cada 1 min

logging:
  level:
    com.skillforge: INFO
    org.apache.catalina.connector: WARN  # suprime Broken pipe / ClientAbortException de SSE
    org.apache.catalina.core: WARN       # suprime dispatcherServlet IOException em SSE fechado
    org.apache.coyote: WARN              # suprime flush error em conexão SSE encerrada pelo cliente
    rabbitmq: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %highlight(%-5level) %cyan(%-30logger{30}) %msg%n"
